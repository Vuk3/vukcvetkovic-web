<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Vuk Cvetković</title>
  <!--
    The V is drawn as a stroked path rather than set as text: a favicon has no
    access to the site's webfont, so text here would render in whatever face the
    OS hands it and change shape from machine to machine.

    The radius matches the portrait in the hero, and the fill is the site accent,
    which reads on both a light and a dark browser chrome.
  -->
  <rect width="32" height="32" rx="7" fill="#0d5c5c" />
  <path
    d="M9 9.5 16 22.5 23 9.5"
    fill="none"
    stroke="#faf9f7"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
